[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dgtl"
version = "0.1.0"
description = "Decoupled GNN transfer learning: frozen pretrained-GNN embeddings + simple regressors for extrapolative materials property prediction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22", "pandas>=1.4", "scipy>=1.8", "scikit-learn>=1.1", "matplotlib>=3.5"]

[project.optional-dependencies]
gnn = ["torch", "torch-geometric", "pymatgen", "tqdm"]
dev = ["pytest"]

[project.scripts]
dgtl = "dgtl.cli:main"

[tool.setuptools.packages.find]
include = ["dgtl*"]

[tool.setuptools.package-data]
"dgtl.extract" = ["*.json"]
